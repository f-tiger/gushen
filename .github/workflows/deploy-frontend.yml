name: Deploy frontend to Cloudflare Pages

# 前端静态站部署到 Cloudflare Pages。
# 需在仓库 Secrets 配置：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
# （可选）Variables 配置 VITE_API_BASE_URL 指向已部署的后端地址。
# 注意：本项目后端是 Python 科学计算栈，Cloudflare Workers 无法运行，需另行托管。

on:
  push:
    branches:
      - claude/skills-prompt-workflow-lb8d7j
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 首次部署前确保 Pages 项目存在（已存在则忽略错误）
          npx --yes wrangler@3 pages project create gushen \
            --production-branch=main 2>/dev/null || echo "项目已存在或已创建，继续部署"
          npx --yes wrangler@3 pages deploy dist \
            --project-name=gushen --branch=main --commit-dirty=true
